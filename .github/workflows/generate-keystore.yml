name: Generate Play / Bazaar Upload Key (One-Time)

# فقط یک‌بار اجرا کنید. اگر کلید قبلی دارید، این workflow را دوباره نزنید؛
# فروشگاه‌ها فقط با همان کلید اولیه به‌روزرسانی را می‌پذیرند.
#
# خروجی artifact (play-bazaar-upload-key):
#   play-bazaar-upload.jks      — فایل keystore (آفلاین نگه دارید)
#   RELEASE_KEYSTORE.base64     — برای Secret: RELEASE_KEYSTORE_BASE64
#   github-secrets.txt          — رمز و alias
#   upload-certificate.bin      — گواهی DER برای کافه‌بازار
#   upload-certificate.pem      — گواهی PEM
#   fingerprints.txt            — SHA1 / SHA256
#   README.txt

on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload keystore + Bazaar certificate kit
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PASS="$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-28)"
          KEY_ALIAS="upload"

          keytool -genkeypair \
            -keystore out/play-bazaar-upload.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Smart Mechanic, OU=Android, O=Smart Mec, L=Tehran, ST=Tehran, C=IR"

          base64 -w0 out/play-bazaar-upload.jks > out/RELEASE_KEYSTORE.base64

          # گواهی برای کافه‌بازار (DER + PEM)
          keytool -exportcert \
            -keystore out/play-bazaar-upload.jks \
            -alias "$KEY_ALIAS" \
            -file out/upload-certificate.bin \
            -storepass "$STORE_PASS"

          keytool -exportcert -rfc \
            -keystore out/play-bazaar-upload.jks \
            -alias "$KEY_ALIAS" \
            -file out/upload-certificate.pem \
            -storepass "$STORE_PASS"

          keytool -list -v \
            -keystore out/play-bazaar-upload.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > out/certificate-info.txt

          {
            echo "# Certificate fingerprints — copy into Cafe Bazaar / Play Console if asked"
            echo ""
            grep -E 'SHA1:|SHA256:|Owner:|Valid' out/certificate-info.txt || true
          } > out/fingerprints.txt

          printf '%s\n' \
            "RELEASE_KEY_ALIAS=$KEY_ALIAS" \
            "RELEASE_KEYSTORE_PASSWORD=$STORE_PASS" \
            "RELEASE_KEY_PASSWORD=$STORE_PASS" \
            > out/github-secrets.txt

          printf '%s\n' \
            '=== یک‌بار اجرا شد — این فایل‌ها را دانلود و آفلاین نگه دارید ===' \
            '' \
            '۱) در GitHub → Settings → Secrets and variables → Actions این‌ها را بگذارید:' \
            '   RELEASE_KEYSTORE_BASE64  ← محتویات فایل RELEASE_KEYSTORE.base64' \
            '   RELEASE_KEYSTORE_PASSWORD' \
            '   RELEASE_KEY_PASSWORD' \
            '   RELEASE_KEY_ALIAS=upload' \
            '' \
            '۲) کافه‌بازار:' \
            '   - APK امضاشده (از workflow Build Flutter APK) را آپلود کنید' \
            '   - در صورت نیاز به گواهی: upload-certificate.bin یا .pem' \
            '   - اثرانگشت‌ها در fingerprints.txt' \
            '' \
            '۳) Google Play: همین کلید را به عنوان Upload key استفاده کنید' \
            '' \
            '⚠️ اگر این کلید گم شود، به‌روزرسانی اپ در فروشگاه‌ها ممکن نیست.' \
            '⚠️ دوباره این workflow را اجرا نکنید مگر اینکه هنوز هیچ‌وقت منتشر نکرده باشید.' \
            > out/README.txt

          ls -lh out/
          echo "----- fingerprints -----"
          cat out/fingerprints.txt

      - name: Upload signing kit (download once, store offline)
        uses: actions/upload-artifact@v4
        with:
          name: play-bazaar-upload-key
          path: out/
          if-no-files-found: error
          retention-days: 7
