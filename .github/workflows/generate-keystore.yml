name: Generate Release Keystore (One-Time)

on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          STORE_PASS="505506+1Tp"   # ⚠️ تغییر دهید
          KEY_ALIAS="release"
          keytool -genkey -v \
            -keystore release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Mechanic, OU=Dev, O=Smart, L=City, ST=State, C=IR"
          echo "KEYSTORE_BASE64=$(base64 -w0 release-keystore.jks)" >> $GITHUB_ENV
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-file
          path: release-keystore.jks

      - name: Print values (copy these)
        run: |
          echo "========================================"
          echo "RELEASE_KEYSTORE_BASE64:"
          echo "${{ env.KEYSTORE_BASE64 }}"
          echo ""
          echo "RELEASE_KEYSTORE_PASSWORD: ${{ env.STORE_PASS }}"
          echo "RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}"
          echo "RELEASE_KEY_PASSWORD: ${{ env.STORE_PASS }}"
          echo "========================================"
          echo "⚠️  موارد بالا را کپی کرده و در Secrets زیر ذخیره کنید:"
          echo "    RELEASE_KEYSTORE_BASE64"
          echo "    RELEASE_KEYSTORE_PASSWORD"
          echo "    RELEASE_KEY_ALIAS"
          echo "    RELEASE_KEY_PASSWORD"
