name: Build Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android --project-name smart_mechanic --org ir.smartmec .
          fi

      - name: Force Fix Android Configurations
        run: |
          # Gradle & Kotlin
          sed -i -E 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.1.0" apply false/' android/settings.gradle || true
          sed -i -E 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle || true
          sed -i -E 's/gradle-[0-9\.]+-all\.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties || true

          # SDK versions
          sed -i -E 's/^.*compileSdk.*$/    compileSdk = 35/g' android/app/build.gradle || true
          sed -i -E 's/^.*minSdk.*$/    minSdk = 24/g' android/app/build.gradle || true
          sed -i -E 's/^.*targetSdk.*$/    targetSdk = 35/g' android/app/build.gradle || true

          # Java 17
          sed -i -E 's/VERSION_1_8/VERSION_17/g' android/app/build.gradle || true
          sed -i -E "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle || true
          sed -i -E 's/jvmTarget = "1.8"/jvmTarget = "17"/g' android/app/build.gradle || true

          # Application ID
          sed -i -E 's/applicationId ".*"/applicationId "ir.smartmec.app"/' android/app/build.gradle || true

          # Permissions
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Inject Google Maps API Key
        if: ${{ secrets.GOOGLE_MAPS_API_KEY != '' }}
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          # AndroidManifest meta-data
          if grep -q "com.google.android.geo.API_KEY" android/app/src/main/AndroidManifest.xml; then
            sed -i "s/android:value=\"[^"]*\"/android:value=\"$MAPS_KEY\"/" android/app/src/main/AndroidManifest.xml || true
          else
            sed -i '/<application /a \        <meta-data android:name="com.google.android.geo.API_KEY" android:value="'