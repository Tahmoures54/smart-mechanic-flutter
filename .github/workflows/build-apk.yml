name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب فلاتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true   # کش داخلی برای pub و ابزارها

      # کش جداگانه برای دارت حذف شد (مرحله‌ی اضافی)

      - name: کش بسته‌های Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache: true

      - name: ایجاد پوشه Android در صورت نبود (با نام صحیح پروژه)
        run: |
          if [ ! -d "android" ]; then
            PROJECT_NAME=$(grep '^name:' pubspec.yaml | sed 's/^name: *//; s/ *$//')
            echo "پوشه android وجود ندارد. ساخت پروژه با نام '$PROJECT_NAME'..."
            flutter create --platforms android --project-name "$PROJECT_NAME" .
          fi

      - name: اصلاح تنظیمات بیلد Android
        run: |
          # 1. به‌روزرسانی Kotlin
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle

          # 2. به‌روزرسانی Android Gradle Plugin
          sed -i 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle

          # 3. به‌روزرسانی Gradle Wrapper
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

          # 4. تنظیم نسخه‌های SDK و حداقل API
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle

          # 5. افزودن ndkVersion در صورت نیاز
          if ! grep -q "ndkVersion" android/app/build.gradle; then
            sed -i '/compileSdkVersion 36/a \    ndkVersion "26.1.10909125"' android/app/build.gradle
          fi

      - name: تزریق مجوزهای مورد نیاز (میکروفون و اینترنت) به AndroidManifest.xml
        run: |
          python3 -c "
          import sys, re

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          # اگر مجوزها از قبل وجود نداشته باشند
          if not any('RECORD_AUDIO' in l for l in lines):
              for i, line in enumerate(lines):
                  if line.strip().startswith('<manifest'):
                      # محاسبه تورفتگی خط <manifest>
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(i+1, f'{indent}<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n')
                      lines.insert(i+2, f'{indent}<uses-permission android:name=\"android.permission.INTERNET\" />\n')
                      break
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.writelines(lines)
              print('مجوزها با موفقیت اضافه شدند.')
          else:
              print('مجوزها از قبل وجود دارند، نیازی به تغییر نیست.')
          "

      - name: دریافت وابستگی‌های فلاتر
        run: flutter pub get

      - name: نصب جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: پذیرش لایسنس‌های Android
        run: yes | flutter doctor --android-licenses

      - name: ساخت APK نسخه انتشار
        run: flutter build apk --release

      - name: آپلود فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
