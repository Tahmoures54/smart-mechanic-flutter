name: Build Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK برای بازار، AAB برای پلی، یا هر دو'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - appbundle

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Ensure .env for assets (production API)
        run: |
          cat > .env << 'EOF'
          API_BASE_URL=https://smart-mec.ir/api
          API_VERSION=
          EOF
          echo "API_BASE_URL set to production smart-mec.ir"
          cat .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Clean previous builds
        run: flutter clean && flutter pub get

      - name: Ensure Gradle wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x android/gradlew || true
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          cat analyze.log
          if grep -Eq '(^|[[:space:]])error •|(^|[[:space:]])Error:' analyze.log; then
            exit 1
          fi
          exit 0

      - name: Test
        run: flutter test

      - name: Generate orange mechanical branding + launcher icons
        run: |
          pip3 install --quiet pillow
          python3 tool/generate_branding.py
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          res = Path("android/app/src/main/res")
          copied = 0
          for folder in sorted(res.glob("mipmap-*")):
              for name in ("ic_launcher.png", "ic_launcher.xml"):
                  src = folder / name
                  dst = folder / name.replace("ic_launcher", "ic_launcher_round", 1)
                  if src.exists() and not dst.exists():
                      dst.write_bytes(src.read_bytes())
                      copied += 1
                      print(f"copied {src} -> {dst}")
          print(f"round-icon fallbacks created: {copied}")
          PY
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Inject Google Maps API Key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::انتشار واقعی به GOOGLE_MAPS_API_KEY در Secrets نیاز دارد"
              exit 1
            fi
            echo "GOOGLE_MAPS_API_KEY not set — placeholder for CI only"
            exit 0
          fi
          python3 -c '
          import os, re
          path = "android/app/src/main/AndroidManifest.xml"
          key = os.environ["MAPS_KEY"]
          text = open(path, encoding="utf-8").read()
          pattern = r"(android:name=\"com\.google\.android\.geo\.API_KEY\"\s+android:value=\")[^\"]*(\")"
          text2, n = re.subn(pattern, rf"\g<1>{key}\2", text)
          if n != 1:
              raise SystemExit(f"Expected exactly one Google Maps API key placeholder, found {n}")
          open(path, "w", encoding="utf-8").write(text2)
          print("Maps API key injected")
          '

      - name: Setup release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::برای انتشار در کافه‌بازار / پلی باید Secrets کلید را ست کنید:"
              echo "  1) Actions → Generate Play / Bazaar Upload Key (یک‌بار)"
              echo "  2) Settings → Secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_PASSWORD, RELEASE_KEY_ALIAS"
              exit 1
            fi
            echo "::warning::بدون keystore — امضای debug (فقط برای CI). برای بازار مناسب نیست."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${RELEASE_KEYSTORE_PASSWORD}" \
            "keyPassword=${RELEASE_KEY_PASSWORD}" \
            "keyAlias=${RELEASE_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties
          echo "✅ Release signing configured (Play + Cafe Bazaar)"

      - name: Export Cafe Bazaar certificate kit
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p bazaar-release

          keytool -exportcert \
            -keystore android/app/upload-keystore.jks \
            -alias "$RELEASE_KEY_ALIAS" \
            -file bazaar-release/upload-certificate.bin \
            -storepass "$RELEASE_KEYSTORE_PASSWORD"

          keytool -exportcert -rfc \
            -keystore android/app/upload-keystore.jks \
            -alias "$RELEASE_KEY_ALIAS" \
            -file bazaar-release/upload-certificate.pem \
            -storepass "$RELEASE_KEYSTORE_PASSWORD"

          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > bazaar-release/certificate-full.txt

          {
            echo "# اثرانگشت گواهی — کافه‌بازار / گوگل‌پلی"
            echo "# Alias: $RELEASE_KEY_ALIAS"
            echo ""
            grep -E 'SHA1:|SHA256:|Owner:|Valid' bazaar-release/certificate-full.txt || true
            echo ""
            echo "# نحوه استفاده در کافه‌بازار:"
            echo "# 1) فایل app-release.apk را در پنل بازار آپلود کنید"
            echo "# 2) versionCode باید از نسخه قبلی بیشتر باشد"
            echo "# 3) همیشه با همین keystore امضا کنید — کلید جدید = عدم امکان آپدیت"
            echo "# 4) در صورت نیاز به گواهی: upload-certificate.bin یا .pem"
          } > bazaar-release/fingerprints.txt

          echo "----- fingerprints -----"
          cat bazaar-release/fingerprints.txt

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Build arm64 APK (Cafe Bazaar)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle' }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Build App Bundle (Google Play)
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'apk') }}
        run: flutter build appbundle --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature + copy into Bazaar kit
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle') }}
        env:
          HAS_KS: ${{ env.HAS_KEYSTORE }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

          echo "===== Certificate of built APK ====="
          keytool -printcert -jarfile "$APK" || true

          if [ "$HAS_KS" = "true" ]; then
            cp "$APK" bazaar-release/app-release.apk
            # تأیید که APK با همان کلید release امضا شده
            echo "✅ Signed APK copied to bazaar-release/ for Cafe Bazaar upload"
          else
            echo "::warning::APK با امضای debug ساخته شد — برای آپلود در کافه‌بازار مناسب نیست. Secrets کلید را ست کنید."
          fi

      - name: Upload APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # بسته آماده کافه‌بازار: APK + گواهی + اثرانگشت (فقط وقتی کلید واقعی هست)
      - name: Upload Cafe Bazaar release package
        if: ${{ env.HAS_KEYSTORE == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle') }}
        uses: actions/upload-artifact@v4
        with:
          name: cafe-bazaar-release
          path: bazaar-release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload certificate kit (with AAB builds too)
        if: ${{ env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: cafe-bazaar-certificate
          path: |
            bazaar-release/upload-certificate.bin
            bazaar-release/upload-certificate.pem
            bazaar-release/fingerprints.txt
            bazaar-release/certificate-full.txt
          if-no-files-found: error
          retention-days: 30

      - name: Job summary (Bazaar / Play)
        if: always()
        run: |
          {
            echo "## خروجی بیلد"
            echo ""
            if [ "${{ env.HAS_KEYSTORE }}" = "true" ]; then
              echo "✅ **امضای release** فعال بود."
              echo ""
              echo "### کافه‌بازار"
              echo "1. Artifact **\`cafe-bazaar-release\`** را دانلود کنید"
              echo "2. فایل **\`app-release.apk\`** را در پنل بازار آپلود کنید"
              echo "3. در صورت نیاز: \`upload-certificate.bin\` / \`fingerprints.txt\`"
              echo "4. version فعلی از pubspec: ببینید versionCode از نسخه قبلی بیشتر باشد"
            else
              echo "⚠️ **بدون keystore** — APK با debug امضا شده و برای بازار قابل قبول نیست."
              echo ""
              echo "### کارهای لازم قبل از انتشار بازار"
              echo "1. Actions → **Generate Play / Bazaar Upload Key** (فقط یک‌بار)"
              echo "2. Settings → Secrets and variables → Actions:"
              echo "   - \`RELEASE_KEYSTORE_BASE64\`"
              echo "   - \`RELEASE_KEYSTORE_PASSWORD\`"
              echo "   - \`RELEASE_KEY_PASSWORD\`"
              echo "   - \`RELEASE_KEY_ALIAS\` (= upload)"
              echo "3. دوباره **Build Flutter APK** را با Run workflow بزنید"
            fi
            echo ""
            echo "### Google Play"
            echo "Artifact **\`app-release-aab\`** را در Play Console آپلود کنید."
          } >> "$GITHUB_STEP_SUMMARY"
