name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle packages
        uses: gradle/gradle-build-action@v2
        with:
          cache: true

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android --project-name smart_mechanic .
          fi

      # ==========================================
      # بخش اصلاح شده - تغییرات در settings.gradle و build.gradle
      - name: Fix Android build configurations
        run: |
          # 1. آپدیت Kotlin در فایل settings.gradle (مخصوص فلاتر 3.22 به بالا)
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
          
          # 2. آپدیت Android Gradle Plugin در فایل settings.gradle
          sed -i 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle
          
          # 3. آپدیت خود Gradle Wrapper
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. آپدیت compileSdkVersion در فایل app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
      # ==========================================

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
