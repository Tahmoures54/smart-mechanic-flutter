name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android --project-name smart_mechanic .
          fi

      - name: Force Fix Android Configurations
        run: |
          # 1. آپدیت Kotlin و Gradle
          sed -i -E 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.1.0" apply false/' android/settings.gradle
          sed -i -E 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle
          sed -i -E 's/gradle-[0-9\.]+-all\.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

          # 2. تنظیم SDK و NDK
          sed -i -E 's/^.*compileSdk.*$/    compileSdk = 36/g' android/app/build.gradle
          sed -i -E 's/^.*minSdk.*$/    minSdk = 24/g' android/app/build.gradle
          sed -i -E 's/^.*targetSdk.*$/    targetSdk = 36/g' android/app/build.gradle
          if grep -q "ndkVersion" android/app/build.gradle; then
            sed -i -E 's/^.*ndkVersion.*$/    ndkVersion = "26.1.10909125"/g' android/app/build.gradle
          else
            sed -i '/compileSdk = 36/a \    ndkVersion = "26.1.10909125"' android/app/build.gradle
          fi

          # 3. تنظیم نسخه JVM
          sed -i -E 's/VERSION_1_8/VERSION_17/g' android/app/build.gradle
          sed -i -E "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle
          sed -i -E 's/jvmTarget = "1.8"/jvmTarget = "17"/g' android/app/build.gradle

          # 4. دسترسی‌های AndroidManifest
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi

      # ----- مراحل جدید: تولید کلید و تنظیم امضا -----
      - name: Setup Java for keytool
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate release keystore
        run: |
          STORE_PASS="YourStrongPassword123"   # ⚠️ این رمز را می‌توانید تغییر دهید (بعداً یادداشت کنید)
          KEY_ALIAS="release"
          keytool -genkey -v \
            -keystore android/app/release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Mechanic, OU=Dev, O=Smart, L=City, ST=State, C=IR"

          # ذخیره اطلاعات در فایل key.properties
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Inject signing configuration into build.gradle
        run: |
          # اضافه کردن بخش signingConfigs قبل از buildTypes
          sed -i '/buildTypes {/i \
          def keystoreProperties = new Properties()\
          def keystorePropertiesFile = rootProject.file('\''key.properties'\'')\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
          }\
          \
          signingConfigs {\
              release {\
                  keyAlias keystoreProperties['\''keyAlias'\'']\
                  keyPassword keystoreProperties['\''keyPassword'\'']\
                  storeFile keystoreProperties['\''storeFile'\''] ? file(keystoreProperties['\''storeFile'\'']) : null\
                  storePassword keystoreProperties['\''storePassword'\'']\
              }\
          }' android/app/build.gradle

          # جایگزینی signingConfig در buildTypes.release
          sed -i '/buildTypes {/,/}/ s/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle
      # ------------------------------------------------

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: flutter build apk --release

      # آپلود APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # آپلود فایل Keystore (برای دانلود و نگهداری)
      - name: Upload release keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: android/app/release-keystore.jks
