name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true  # فعال‌سازی کش برای Flutter SDK

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle packages
        uses: gradle/gradle-build-action@v2
        with:
          cache: true

      # (اختیاری) هماهنگ‌سازی نسخه Kotlin با نیازمندی‌های Flutter 3.22
      # اگر پروژهٔ شما از قبل Kotlin 1.8.10 دارد، این بخش را حذف کنید.
      - name: Ensure Kotlin version compatibility
        run: |
          KOTLIN_VERSION="1.8.10"
          ROOT_BUILD="android/build.gradle"
          APP_BUILD="android/app/build.gradle"

          # تنظیم ext.kotlin_version در ریشه
          if grep -q "ext.kotlin_version" "$ROOT_BUILD"; then
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '$KOTLIN_VERSION'/" "$ROOT_BUILD"
          else
            echo "ext.kotlin_version = '$KOTLIN_VERSION'" >> "$ROOT_BUILD"
          fi

          # اضافه کردن resolutionStrategy برای جلوگیری از تداخل نسخه‌ها
          if ! grep -q "resolutionStrategy" "$APP_BUILD"; then
            echo "
            configurations.all {
                resolutionStrategy {
                    force 'org.jetbrains.kotlin:kotlin-stdlib:$KOTLIN_VERSION'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:$KOTLIN_VERSION'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:$KOTLIN_VERSION'
                }
            }" >> "$APP_BUILD"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
   
     
