name: Build Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK برای بازار / گوشی‌های امروزی، یا AAB برای انتشار استور'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - appbundle

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Ensure .env for assets (production API)
        run: |
          cat > .env << 'EOF'
          API_BASE_URL=https://smart-mec.ir/api
          API_VERSION=
          EOF
          echo "API_BASE_URL set to production smart-mec.ir"
          cat .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Clean previous builds
        run: flutter clean && flutter pub get

      - name: Ensure Gradle wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x android/gradlew || true
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          code=$?
          cat analyze.log
          {
            echo '## Flutter analyze'
            echo '```text'
            cat analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Test
        if: always()
        id: test
        continue-on-error: true
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          cat test.log
          {
            echo '## Flutter test'
            echo '```text'
            cat test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload diagnostics when checks fail
        if: failure() || steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-check-logs
          path: |
            analyze.log
            test.log
          if-no-files-found: ignore

      - name: Fail if checks failed
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Generate orange mechanical branding + launcher icons
        run: |
          pip3 install --quiet pillow
          python3 tool/generate_branding.py
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          res = Path("android/app/src/main/res")
          copied = 0
          for folder in sorted(res.glob("mipmap-*")):
              for name in ("ic_launcher.png", "ic_launcher.xml"):
                  src = folder / name
                  dst = folder / name.replace("ic_launcher", "ic_launcher_round", 1)
                  if src.exists() and not dst.exists():
                      dst.write_bytes(src.read_bytes())
                      copied += 1
                      print(f"copied {src} -> {dst}")
          print(f"round-icon fallbacks created: {copied}")
          PY
          find android/app/src/main/res -name 'ic_launcher*' | sort
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Inject Google Maps API Key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "A real release build requires GOOGLE_MAPS_API_KEY"
              exit 1
            fi
            echo "GOOGLE_MAPS_API_KEY not set — keeping local placeholder for CI validation"
            exit 0
          fi
          python3 -c '
          import os, re
          path = "android/app/src/main/AndroidManifest.xml"
          key = os.environ["MAPS_KEY"]
          text = open(path, encoding="utf-8").read()
          pattern = r"(android:name=\"com\.google\.android\.geo\.API_KEY\"\s+android:value=\")[^\"]*(\")"
          text2, n = re.subn(pattern, rf"\g<1>{key}\2", text)
          if n != 1:
              raise SystemExit(f"Expected exactly one Google Maps API key placeholder, found {n}")
          open(path, "w", encoding="utf-8").write(text2)
          print("Maps API key injected")
          '

      - name: Setup release signing (required for tags/manual releases)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "A real release build requires RELEASE_KEYSTORE_* secrets"
              exit 1
            fi
            echo "No release keystore — using debug signing for CI validation"
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${RELEASE_KEYSTORE_PASSWORD}" \
            "keyPassword=${RELEASE_KEY_PASSWORD}" \
            "keyAlias=${RELEASE_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties
          echo "Release signing configured"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Build single arm64 APK (modern phones / Cafe Bazaar)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle' }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Build App Bundle
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'apk') }}
        run: flutter build appbundle --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
