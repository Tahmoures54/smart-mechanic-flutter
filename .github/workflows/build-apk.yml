name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle packages
        uses: gradle/gradle-build-action@v2
        with:
          cache: true

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android --project-name smart_mechanic .
          fi

      - name: Fix Android build configurations and Inject Permissions
        run: |
          # 1. آپدیت Kotlin (2.0.21 برای فلاتر 3.22)
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
          
          # 2. آپدیت Android Gradle Plugin
          sed -i 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle
          
          # 3. آپدیت Gradle Wrapper به 8.7
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. تنظیم compileSdkVersion و targetSdkVersion روی 36
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
          
          # 5. اضافه‌کردن ndkVersion
          if ! grep -q "ndkVersion" android/app/build.gradle; then
            sed -i '/compileSdkVersion 36/a \    ndkVersion "26.1.10909125"' android/app/build.gradle
          fi

          # 6. تزریق دسترسی میکروفون و اینترنت به فایل AndroidManifest.xml (بسیار مهم برای جلوگیری از کرش)
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest xmlns:android=/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
