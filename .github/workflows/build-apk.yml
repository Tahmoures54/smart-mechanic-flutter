name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle packages
        uses: gradle/gradle-build-action@v2
        with:
          cache: true

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android --project-name smart_mechanic .
          fi

      - name: Force Fix Android Configurations (Flutter 3.22 Syntax)
        run: |
          # 1. آپدیت Kotlin و Gradle Plugin
          sed -i -E 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
          sed -i -E 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle
          
          # 2. آپدیت Gradle Wrapper
          sed -i -E 's/gradle-[0-9\.]+-all\.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. جستجو و جایگزینی هوشمند SDK (حل قطعی مشکل)
          sed -i -E 's/^.*compileSdk.*$/    compileSdk = 36/g' android/app/build.gradle
          sed -i -E 's/^.*minSdk.*$/    minSdk = 24/g' android/app/build.gradle
          sed -i -E 's/^.*targetSdk.*$/    targetSdk = 36/g' android/app/build.gradle
          
          # 4. جستجو و تنظیم دقیق NDK
          if grep -q "ndkVersion" android/app/build.gradle; then
            sed -i -E 's/^.*ndkVersion.*$/    ndkVersion = "26.1.10909125"/g' android/app/build.gradle
          else
            sed -i '/compileSdk = 36/a \    ndkVersion = "26.1.10909125"' android/app/build.gradle
          fi

          # 5. تزریق دسترسی‌های میکروفون و اینترنت
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
