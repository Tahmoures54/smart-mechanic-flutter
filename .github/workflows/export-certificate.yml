name: Export Certificate for Cafe Bazaar

# خروجی:
#   - upload-certificate.bin  (DER باینری — فرمت استاندارد keytool بدون -rfc)
#   - upload-certificate.pem  (PEM متنی)
#   - fingerprints.txt       (SHA1 / SHA256 برای پنل بازار و Google)
#
# این فایل‌ها را یک‌بار در پنل کافه‌بازار نگه دارید.
# برای آپلود معمولی APK فقط به APK امضاشده نیاز دارید؛
# گواهی/اثرانگشت برای تأیید هویت توسعه‌دهنده یا App Bundle مفید است.

on: workflow_dispatch

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets exist
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "❌ RELEASE_KEYSTORE_BASE64 secret is empty!"
            echo "Go to Settings → Secrets and variables → Actions and add it."
            echo "First run the workflow: Generate Play / Bazaar Upload Key"
            exit 1
          fi
          echo "✅ Keystore secret found (length: ${#KS} chars)"

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          ls -lh upload-keystore.jks

      - name: Show certificate info (for verification)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore upload-keystore.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"

      - name: Export public certificate (DER .bin + PEM) and fingerprints
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p out

          # DER باینری (بدون -rfc) — نام .bin برای سازگاری با مستندات بازار
          keytool -exportcert \
            -keystore upload-keystore.jks \
            -alias "$RELEASE_KEY_ALIAS" \
            -file out/upload-certificate.bin \
            -storepass "$RELEASE_KEYSTORE_PASSWORD"

          # PEM متنی (با -rfc)
          keytool -exportcert -rfc \
            -keystore upload-keystore.jks \
            -alias "$RELEASE_KEY_ALIAS" \
            -file out/upload-certificate.pem \
            -storepass "$RELEASE_KEYSTORE_PASSWORD"

          # اثرانگشت‌ها برای پنل بازار / پلی / Firebase
          keytool -list -v \
            -keystore upload-keystore.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > out/certificate-full.txt

          {
            echo "# Certificate fingerprints for Cafe Bazaar / Google Play / Maps"
            echo "# Alias: $RELEASE_KEY_ALIAS"
            echo ""
            grep -E 'SHA1:|SHA256:|Owner:|Valid' out/certificate-full.txt || true
            echo ""
            echo "# How to use on Cafe Bazaar:"
            echo "# 1) Upload the signed APK (app-release.apk) from Build Flutter APK workflow"
            echo "# 2) Keep the same keystore forever — Bazaar rejects updates with a different sign"
            echo "# 3) If the panel asks for certificate, upload upload-certificate.bin or .pem"
          } > out/fingerprints.txt

          ls -lh out/
          echo "----- fingerprints.txt -----"
          cat out/fingerprints.txt

      - name: Upload Bazaar certificate kit
        uses: actions/upload-artifact@v4
        with:
          name: cafe-bazaar-certificate
          path: out/
          if-no-files-found: error
          retention-days: 30
