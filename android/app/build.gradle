plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ir.smartmec.app"
    
    // 1. ارتقا به نسخه 36 جهت پشتیبانی از flutter_tts و geolocator و speech_to_text
    compileSdk = 36
    
    // 2. تعیین نسخه NDK سازگار با پلاگین‌ها
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "ir.smartmec.app"
        
        // 3. رفع خطای اصلی: قرار دادن مستقیم نسخه 24 به جای شرط قبلی
        minSdk = 24
        targetSdk = 36
        
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storePassword = keystoreProperties["storePassword"]
                def storePath = keystoreProperties["storeFile"]
                if (storePath != null) {
                    def f = file(storePath)
                    if (!f.exists()) f = rootProject.file(storePath)
                    storeFile = f
                }
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // کتابخانه لازم برای desugaring جاوا
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
