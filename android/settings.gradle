pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = new File(rootDir, "local.properties")
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
            def path = properties.getProperty("flutter.sdk")
            if (path != null) return path
        }
        def envPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        if (envPath != null) return envPath
        throw new GradleException("flutter.sdk not set in local.properties and FLUTTER_ROOT is not defined")
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "2.2.0" apply false
}

include ":app"

// Plugins need flutter.compileSdkVersion; skip :app (Flutter plugin owns it)
gradle.beforeProject { project ->
    if (project.name == "app" || project.name == "smart_mechanic") {
        return
    }
    if (!project.ext.has("flutter")) {
        project.ext.flutter = [
            compileSdkVersion: 36,
            minSdkVersion    : 24,
            targetSdkVersion : 36,
            ndkVersion       : "27.0.12077973",
        ]
    }
}
