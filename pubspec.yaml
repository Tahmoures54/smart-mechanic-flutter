name: Build Flutter APK & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --- جاب بیلد و تست اندروید ---
  build-android:
    name: Build & Test Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 🔧 اطمینان از وجود sdk constraint (با اسکریپت Python ضد خطا)
      - name: Ensure SDK constraint in pubspec.yaml
        run: |
          python3 -c "
          import re, sys
          env_key = 'environment:'
          sdk_line = \"  sdk: '^3.4.0'\"
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if env_key not in content:
              # افزودن بلوک کامل در انتها
              content += f'\n{env_key}\n{sdk_line}\n'
          else:
              lines = content.splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  out.append(line)
                  if line.strip() == env_key:
                      j = i + 1
                      found = False
                      while j < len(lines) and (lines[j].startswith(' ') or lines[j].startswith('\t') or lines[j].strip() == ''):
                          if re.match(r'\s+sdk:', lines[j]):
                              found = True
                              break
                          j += 1
                      if not found:
                          out.append(sdk_line + '\n')
                  i += 1
              content = ''.join(out)
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          print('✅ pubspec.yaml updated')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --- بیلد اندروید ---
      - name: Build APK Debug
        run: flutter build apk --debug
      
      - name: Build APK Release
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --split-per-abi
      
      - name: Upload APK Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-splits
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols

  # --- جاب بیلد iOS ---
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Ensure SDK constraint in pubspec.yaml
        run: |
          python3 -c "
          import re, sys
          env_key = 'environment:'
          sdk_line = \"  sdk: '^3.4.0'\"
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if env_key not in content:
              content += f'\n{env_key}\n{sdk_line}\n'
          else:
              lines = content.splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  out.append(line)
                  if line.strip() == env_key:
                      j = i + 1
                      found = False
                      while j < len(lines) and (lines[j].startswith(' ') or lines[j].startswith('\t') or lines[j].strip() == ''):
                          if re.match(r'\s+sdk:', lines[j]):
                              found = True
                              break
                          j += 1
                      if not found:
                          out.append(sdk_line + '\n')
                  i += 1
              content = ''.join(out)
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          print('✅ pubspec.yaml updated')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
