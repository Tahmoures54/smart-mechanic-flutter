name: Build Flutter APK & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --- جاب بیلد و تست اندروید ---
  build-android:
    name: Build & Test Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # فلتر نسخه‌های جدید نیاز به جاوا ۱۷ دارند

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        # اگر کدی فرمت نشده باشد، این استپ FAIL می‌شود تا توسعه‌دهنده کد را مرتب کند

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --- بخش بیلد آندروید ---
      - name: Build APK Debug
        run: flutter build apk --debug
      
      - name: Build APK Release
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --split-per-abi
      
      # --- آپلود فایل خروجی ---
      - name: Upload APK Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-splits
          # فقط فایل‌های APK ریلیز آپلود می‌شوند (هر ۳ معماری)
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          # آپلود فایل سمبول برای دیکد کردن کرش‌های اوبفوسکیت شده
          path: build/symbols

  # --- جاب بیلد iOS (مجزا چون نیاز به رانر مک دارد) ---
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    # برای صرفه‌جویی در منابع گیت‌هاب، فقط وقتی روی برنچ main پوش می‌شود اجرا شود
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
