name: smart_mechanic
description: عیب‌یابی هوشمند خودرو با کمک هوش مصنوعی، تحلیل صدا و نقشه تعمیرگاه‌های نزدیک
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Networking
  http: ^1.2.2

  # Audio & Speech
  flutter_sound: ^9.11.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # UI & Utilities
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3+2
  share_plus: ^10.0.2
  webview_flutter: ^4.9.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
