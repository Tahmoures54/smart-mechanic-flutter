name: smart_mechanic
description: عیب‌یابی هوشمند خودرو با کمک هوش مصنوعی، تحلیل صدا و نقشه تعمیرگاه‌های نزدیک
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Networking
  http: ^1.2.2

  # Audio & Speech
  flutter_sound: ^9.11.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # UI & Utilities
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3+2
  share_plus: ^10.0.2
  webview_flutter: ^4.9.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  url_launcher: ^6.3.0

dependency_overrides:
  # رفع ناسازگاری geolocator_android با AGP جدید
  geolocator_android: ^4.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0D0D12"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D0D12"
  color_dark: "#0D0D12"
  image: assets/branding/splash_mark.png
  android_12:
    color: "#0D0D12"
    icon_background_color: "#0D0D12"
    image: assets/branding/splash_mark.png
