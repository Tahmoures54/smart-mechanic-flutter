name: smart_mechanic
description: Smart Mechanic - AI car diagnostics
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.4.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Networking
  http: ^1.1.0

  # Audio & Speech
  record: ^5.0.1
  flutter_sound: ^9.2.5
  speech_to_text: ^6.4.0
  flutter_tts: ^4.0.0
  fft: ^0.2.0   # اصلاح شد – نسخه‌ی موجود در pub.dev

  # Maps & Location
  google_maps_flutter: ^2.5.0
  google_places_flutter: ^2.0.0
  geolocator: ^10.1.0

  # UI & Utilities
  google_fonts: ^6.1.0
  flutter_markdown: ^0.6.0
  share_plus: ^7.1.0
  webview_flutter: ^4.4.1
  permission_handler: ^11.0.0
  path_provider: ^2.1.1
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
